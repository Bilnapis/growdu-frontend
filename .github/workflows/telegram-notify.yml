name: Notify Telegram on Push

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        run: |
          MESSAGE="🚀 New push to repository \n Repo: ${{ github.repository }} \n Branch: ${{ github.ref_name }} \n By: ${{ github.actor }} \n Commit: ${{ github.event.head_commit.message }} \n View Commit: ${{ github.event.head_commit.url }}"

  curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
  --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
  --data-urlencode "text=$MESSAGE"
